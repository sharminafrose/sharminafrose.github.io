    Technical Skills:
      - label: Programming
        details: Python, SQL, Java, C, C++, MATLAB, Assembly, RUST, Julia, R, PHP
      - label: AI/ML
        details: Machine Learning (XGBoost, Logistic Regression, Support Vector Machine, Decision Tree, Random Forest, Ensemble, Anomaly detection), Deep Learning (TabNet, CNN, MLP, LSTM, GAN, Transformer, NLP), TensorFlow, PyTorch, Keras and other libraries
